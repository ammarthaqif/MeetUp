<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multi-floor corporate meeting room booking system with real-time availability matrix, Google Calendar and Outlook synchronization, interactive floor plans, and administrative management." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Meeting Room Booking System - Workspace Matrix</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #94a3b8; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #1e293b; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 18px; font-weight: 800; color: #f8fafc; margin: 0 0 6px 0; letter-spacing: -0.025em;">Loading Workspace Matrix...</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0 0 16px 0; max-width: 320px;">Connecting to enterprise room schedules and availability engine</p>
        
        <div id="loader-fallback" style="display: none; margin-top: 12px; max-width: 380px; padding: 16px; background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; border-radius: 16px; text-align: center;">
          <p style="font-size: 12px; color: #cbd5e1; margin: 0 0 12px 0;">Taking longer than expected? You can reset local cache to launch fresh.</p>
          <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload();" style="padding: 8px 18px; background: #4f46e5; color: #ffffff; border: none; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;">
            Reset Cache & Reload
          </button>
        </div>

        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>

        <script>
          // Fail-safe: Reveal reset button if React does not mount within 4 seconds
          setTimeout(function() {
            var fb = document.getElementById('loader-fallback');
            if (fb) fb.style.display = 'block';
          }, 4000);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
