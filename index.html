<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multi-floor corporate meeting room booking system with real-time availability matrix, Google Calendar and Outlook synchronization, interactive floor plans, and administrative management." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Meeting Room Booking System - Workspace Matrix</title>
    
    <!-- Preconnect to Google Fonts for zero-render-blocking font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #94a3b8; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: matrix-spin 0.6s linear infinite; margin-bottom: 18px;"></div>
        <h2 style="font-size: 17px; font-weight: 700; color: #f8fafc; margin: 0 0 6px 0; letter-spacing: -0.02em;">Loading Workspace Matrix...</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0 0 16px 0; max-width: 320px;">Connecting to enterprise room schedules and availability engine</p>
        
        <div id="loader-fallback" style="display: none; margin-top: 8px; max-width: 360px; padding: 14px 18px; background: rgba(30, 41, 59, 0.9); border: 1px solid #334155; border-radius: 14px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
          <p style="font-size: 12px; color: #cbd5e1; margin: 0 0 10px 0;">Taking longer than usual? Click below to load with fresh cache.</p>
          <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload();" style="padding: 7px 16px; background: #4f46e5; color: #ffffff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
            Clear Cache & Quick Launch
          </button>
        </div>

        <style>
          @keyframes matrix-spin { to { transform: rotate(360deg); } }
        </style>

        <script>
          // Reveal fast recovery button if React root mounting takes more than 1.8 seconds
          setTimeout(function() {
            var fb = document.getElementById('loader-fallback');
            if (fb) fb.style.display = 'block';
          }, 1800);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
