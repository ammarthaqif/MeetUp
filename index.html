<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multi-floor corporate meeting room booking system with real-time availability matrix, Google Calendar and Outlook synchronization, interactive floor plans, and administrative management." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Meeting Room Booking System - Workspace Matrix</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #334155; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 16px; font-weight: 700; color: #0f172a; margin: 0 0 4px 0;">Loading Workspace Matrix...</h2>
        <p style="font-size: 12px; color: #64748b; margin: 0;">Connecting to enterprise room schedules and availability engine</p>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
